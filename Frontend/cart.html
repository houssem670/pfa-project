<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Commercial App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo"><a href="products.html">🛍️ Commercial App</a></div>
        <div class="nav-links">
            <a href="products.html">Products</a>
            <a href="cart.html">Cart 🛒</a>
            <a href="orders.html">My Orders</a>
            <span id="userEmail" class="user-info"></span>
            <button onclick="logout()" class="logout-btn">Logout</button>
        </div>
    </div>

    <div class="container">
        <h1>Shopping Cart</h1>
        <div id="cartContent"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';
        let token = localStorage.getItem('token');

        if (!token) {
            window.location.href = 'login.html';
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            document.getElementById('userEmail').textContent = payload.email || payload.id;
        } catch(e) {}

        displayCart();

        function displayCart() {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const cartDiv = document.getElementById('cartContent');
            
            if (cart.length === 0) {
                cartDiv.innerHTML = `
                    <div class="alert alert-info">
                        Your cart is empty. <a href="products.html">Continue Shopping</a>
                    </div>
                `;
                return;
            }
            
            let total = 0;
            let cartHtml = `
                <table class="cart-table">
                    <thead>
                        <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
                    </thead>
                    <tbody>
            `;
            
            cart.forEach((item, index) => {
                const subtotal = item.price * item.quantity;
                total += subtotal;
                cartHtml += `
                    <tr>
                        <td>${escapeHtml(item.name)}</td>
                        <td>$${item.price}</td>
                        <td>
                            <input type="number" class="quantity-input" value="${item.quantity}" min="1" 
                                   onchange="updateQuantity(${index}, this.value)">
                        </td>
                        <td>$${subtotal.toFixed(2)}</td>
                        <td><button class="remove-btn" onclick="removeItem(${index})">Remove</button></td>
                    </tr>
                `;
            });
            
            cartHtml += `
                    </tbody>
                </table>
                <div style="text-align: right; margin-top: 1rem;">
                    <h3>Total: $${total.toFixed(2)}</h3>
                    <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
                </div>
            `;
            
            cartDiv.innerHTML = cartHtml;
        }

        function updateQuantity(index, quantity) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart[index].quantity = parseInt(quantity);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            displayCart();
        }

        async function checkout() {
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');
    
    console.log('Cart before checkout:', cart);
    
    if (cart.length === 0) {
        alert('Your cart is empty!');
        return;
    }
    
    // Get shipping details
    const address = prompt('Enter street address:');
    if (!address) { alert('Address is required!'); return; }
    
    const city = prompt('Enter city:');
    if (!city) { alert('City is required!'); return; }
    
    const postalCode = prompt('Enter postal code:');
    if (!postalCode) { alert('Postal code is required!'); return; }
    
    const country = prompt('Enter country:');
    if (!country) { alert('Country is required!'); return; }
    
    const paymentMethod = prompt('Payment method (PayPal/Credit Card):');
    if (!paymentMethod) { alert('Payment method is required!'); return; }
    
    // Format items correctly for your API - using "items" field
    const items = cart.map(item => ({
        product: item.product,
        name: item.name,
        price: item.price,
        quantity: item.quantity
    }));
    
    const orderData = {
        items: items,  // ← This is the key change! Use "items", not "orderItems"
        shippingAddress: {
            address: address,
            city: city,
            postalCode: postalCode,
            country: country
        },
        paymentMethod: paymentMethod
    };
    
    console.log('Order being sent:', orderData);
    
    try {
        const response = await fetch(`${API_URL}/orders`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(orderData)
        });
        
        const data = await response.json();
        console.log('Order response:', data);
        
        if (response.ok) {
            alert('Order placed successfully!');
            localStorage.removeItem('cart');
            window.location.href = 'orders.html';
        } else {
            alert('Error: ' + (data.message || 'Failed to place order'));
        }
    } catch (error) {
        console.error('Checkout error:', error);
        alert('Network error. Please try again.');
    }
}

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('cart');
            window.location.href = 'login.html';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
