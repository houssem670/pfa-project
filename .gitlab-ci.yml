workflow:
  name: Commercial App CI/CD Pipeline
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH =~ /^feature.*/
      when: always

stages:
  - test
  - build
  - container-test
  - push
  - deploy

variables:
  APP_NAME: commercial-app
  IMAGE_TAG: $CI_PIPELINE_ID
  IMAGE_NAME: $APP_NAME:$IMAGE_TAG
  DOCKER_IMAGE: $DOCKER_USERNAME/$APP_NAME:$IMAGE_TAG

.prepare_node_env:
  image: node:18-alpine
  stage: test
  services:
    - name: mongo:6
      alias: mongo
  variables:
    MONGO_URI: mongodb://mongo:27017/commercial_db
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm install

unit_tests:
  extends: .prepare_node_env
  script:
    - npm test

docker_build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - docker images $DOCKER_IMAGE
    - mkdir image
    - docker save $DOCKER_IMAGE > image/$APP_NAME-$IMAGE_TAG.tar
  artifacts:
    paths:
      - image/
    expire_in: 2 days

docker_container_test:
  stage: container-test
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - docker_build
  script:
    - docker load -i image/$APP_NAME-$IMAGE_TAG.tar
    - docker run -d --name app-test -p 5000:5000 $DOCKER_IMAGE
    - sleep 10
    - docker ps
    - docker exec app-test wget -qO- http://localhost:5000/health || exit 1

docker_push:  
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - docker_container_test
  script:
    - docker load -i image/$APP_NAME-$IMAGE_TAG.tar
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker push $DOCKER_IMAGE

.k8s_deploy_template: &k8s_deploy
  image: alpine:3.18
  before_script:
    - apk add --no-cache curl gettext
    - curl -LO https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/kubectl
    - kubectl version --client

k8s_deploy_dev:
  <<: *k8s_deploy
  stage: deploy
  needs:
    - docker_push
  script:
    - export KUBECONFIG=$DEV_KUBECONFIG
    - kubectl get nodes
    - kubectl create secret generic mongo-secret \
        --from-literal=MONGO_URI=$MONGO_URI \
        --dry-run=client -o yaml | kubectl apply -f -
    - for file in k8s/*.yaml; do envsubst < $file | kubectl apply -f -; done
    - kubectl get all -n dev
  environment:
    name: development