workflow:
  name: Commercial App CI/CD Pipeline
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - if: $CI_COMMIT_BRANCH =~ /^feature.*/
      when: always

stages:
  - test
  - quality  
  - build
  - security
  - container-test
  - push
  - deploy

variables:
  APP_NAME: commercial-app
  IMAGE_TAG: $CI_PIPELINE_ID
  DOCKER_IMAGE: $DOCKER_USERNAME/$APP_NAME:$IMAGE_TAG

.prepare_node_env:
  image: node:20-alpine
  services:
    - name: mongo:6
      alias: mongo
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  before_script:
    - npm install 

unit_tests:
  extends: .prepare_node_env
  stage: test
  script:
    - npm test

sonarqube_scan:
  extends: .prepare_node_env
  stage: quality
  tags:
    - local
  script:
    - npm install -g sonarqube-scanner
    - sonar-scanner -Dsonar.projectKey=commercial_app -Dsonar.sources=. -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN

snyk_scan:
  stage: security
  image: node:20-alpine
  before_script:
    - npm install -g snyk
  script:
    - snyk auth $SNYK_TOKEN
    - npm ci
    - snyk test || true 

docker_build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t $DOCKER_IMAGE .
    - mkdir image
    - docker save $DOCKER_IMAGE > image/$APP_NAME-$IMAGE_TAG.tar
  artifacts:
    paths:
      - image/

trivy_scan:
  stage: container-test
  image:
    name: aquasec/trivy:0.50.1
    entrypoint: [""]
  needs:
    - docker_build
  script:
    - trivy image --input image/$APP_NAME-$IMAGE_TAG.tar --severity HIGH,CRITICAL

docker_container_test:
  stage: container-test
  image: docker:24
  services:
    - docker:24-dind
    - name: mongo:6
      alias: mongo
  needs:
    - docker_build
  script:
    - docker load -i image/$APP_NAME-$IMAGE_TAG.tar
    - docker run -d --name app-test -p 5000:5000 -e MONGO_URI=$MONGO_URI $DOCKER_IMAGE
    - sleep 10
    - docker exec app-test wget -qO- http://localhost:5000/health || exit 1

docker_push:
  stage: push
  image: docker:24
  services:
    - docker:24-dind
  needs:
    - docker_container_test
  script:
    - docker load -i image/$APP_NAME-$IMAGE_TAG.tar
    - docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD
    - docker push $DOCKER_IMAGE

.k8s_deploy_template: &k8s_deploy
  before_script:
    - curl -LO https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl
    - chmod +x kubectl
    - export PATH=$PATH:$(pwd)
    - kubectl version --client

k8s_deploy_dev:
  <<: *k8s_deploy
  stage: deploy
  tags:
    - local
  needs:
    - docker_push
  script:
    - echo "$DEV_KUBECONFIG" > kubeconfig.yaml
    - export KUBECONFIG=$(pwd)/kubeconfig.yaml
    - kubectl get nodes
    - kubectl create secret generic mongo-secret --from-literal=MONGO_URI=$MONGO_URI --dry-run=client -o yaml | kubectl apply -f -
    - helm upgrade --install app ./chart -n dev
    - kubectl get all -n dev