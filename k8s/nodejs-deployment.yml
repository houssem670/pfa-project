apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-app
  namespace: dev
  labels:
    app: myapp
    type: backend

spec:
  replicas: 1
  selector:
    matchLabels:
      type: backend

  template:
    metadata:
      labels:
        app: myapp
        type: backend

    spec:
      serviceAccountName: nodejs-sa
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000

      containers:
        - name: nodejs
          image: commercial-backend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret

          resources:
            requests:
              cpu: "200m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          securityContext:
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3