apiVersion: v1 
kind: LimitRange
metadata: 
  name: pod-limit-range
  namespace: dev
spec: 
  limits: 
    - type: Container 
      min:
        cpu: "100m" 
        memory: "128Mi"
      max:
        cpu: "1" 
        memory: "512Mi"
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "200m"
        memory: "128Mi"
