{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  namespace: {{ .Values.namespace }}

spec:
  rules:
    - host: {{ .Values.ingress.host }}       
      http:                                  
        paths:                              
          - path: /                         
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.serviceName }}
                port:
                  number: {{ .Values.ingress.servicePort }}

{{- end }}