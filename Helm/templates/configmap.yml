apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.configmap.data.NODE_ENV | quote }} 
  APP_NAME: {{ .Values.configmap.data.APP_NAME | quote }}
  PORT: {{ .Values.configmap.data.PORT | quote }}
  ADMIN_EMAIL: {{ .Values.configmap.data.ADMIN_EMAIL | quote }}

  