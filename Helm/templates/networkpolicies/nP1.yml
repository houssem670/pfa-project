{{- if .Values.networkPolicy.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-nodejs
  namespace: {{ .Values.namespace }}

spec:
  podSelector:
    matchLabels:
      type: {{ .Values.nodejs.labels.type }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.nodejs.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.nodejs.port }}

{{- end }}